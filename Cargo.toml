[package]
name = "farol"
version = "0.1.0-rc.1"
edition = "2024"
description = "A local code-review app with guided reading order and implementation context"
repository = "https://github.com/asnunes/farol"
license = "MIT"

[dependencies]
# Only for restoring the default SIGPIPE disposition; see main.rs.
libc = "0.2"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive"] }
gix = "0.86.0"
notify = "8.2.0"
rust-embed = { version = "8.12.0", features = ["compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
# Publishing a review talks HTTPS. Blocking, because every use case in farol
# is, and small: the async clients bring a runtime this one call does not need.
# `platform-verifier` so the operating system's certificate store is what
# decides — an Enterprise host behind a company CA works without a flag.
ureq = { version = "3.4.0", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
